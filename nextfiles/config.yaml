name: Nextfiles
version: "1.4.0"
slug: nextfiles
description: Self-hosted file storage solution with MariaDB database, APCu cache, Redis support and PHP 8.5 optimization for Home Assistant
url: https://github.com/Dino0005/homeassistant-nextfiles/tree/main/nextfiles
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
map:
  - share:rw
options:
  admin_user: admin
  admin_password: null
  mariadb_host: core-mariadb
  mariadb_database: nextcloud
  mariadb_username: nextcloud
  mariadb_password: null
  trusted_domains:
    - localhost
  trusted_proxies:
    - 172.30.0.0/16
    - 172.16.0.0/12
    - 127.0.0.1
  max_upload_size: 512M
  memory_limit: 512M
  redis_host: ""
  redis_port: 6379
  redis_password: ""
  default_phone_region: IT
schema:
  admin_user: str
  admin_password: password
  mariadb_host: str
  mariadb_database: str
  mariadb_username: str
  mariadb_password: password
  trusted_domains:
    - str
  trusted_proxies:
    - str
  max_upload_size: str
  memory_limit: str
  redis_host: str?
  redis_port: port?
  redis_password: password?
  default_phone_region: str
#image: ghcr.io/dino0005/nextfiles-{arch}
