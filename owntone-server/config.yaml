name: "OwnTone Server"
version: "1.1.0"
description: "Server multimediale DAAP (iTunes), AirPlay e Chromecast per la tua musica"
slug: "owntone_server"
url: "https://github.com/Dino0005/homeassistant-nextfiles/tree/main/owntone-server"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
audio: true
map:
  - type: media
    read_only: true
  - type: app_config
    read_only: false
ingress: true
ingress_port: 3689
webui: "http://[HOST]:[PORT:3689]/"
options:
  log_level: "info"
schema:
  log_level: "list(trace|debug|info|warn|error)"
